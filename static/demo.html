<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万界门 · 让灵感发生连接</title><link rel="stylesheet" href="/demo.css"></head>
<body>
<header><a class="brand" href="/demo"><span class="brand-mark">◌</span><span>万界门<small>WANJIE GATE</small></span></a><nav><span id="connection" class="pill">正在连接</span><button id="settings">连接设置</button><button id="history">我的产物 <span id="result-count">0</span></button></nav></header>
<main id="canvas" aria-label="灵感画布"><div class="canvas-heading"><span class="eyebrow">A SPACE FOR YOUR NEXT IDEA</span><h1>一个念头，通向万千可能。</h1><p>把想法放进来，让资料与行动自然相遇。</p></div>
<div id="bubbles" aria-live="polite"></div>
<section class="capsule-zone"><div class="capsule"><span class="capsule-symbol">✳</span><textarea id="intent" rows="1" placeholder="此刻，你想探索什么？" aria-label="你的想法" maxlength="1800"></textarea><div class="capsule-actions"><button id="more" title="增加最多 3 个灵感" aria-label="更多灵感">＋</button><button id="refresh" title="保留固定泡泡，换一批灵感" aria-label="换一批">↻</button></div></div><div class="capsule-caption"><span id="status" role="status">输入一个想法，Jev 会帮你找到合适的下一步</span><span id="save-status">本地画布</span></div></section>
<div id="welcome" class="welcome"><div class="starter-label">从一个小小的念头开始</div><div class="starters"><button data-prompt="根据我添加的阅读笔记整理观点，写一篇有引用的读书感想">⌑ 阅读与写作</button><button data-prompt="查询上证指数 sh000001 的行情，整理一张研究卡片，标注报价时间">↗ 股票研究</button><button data-prompt="我想学习 Python，先找官方资料并形成学习计划">✧ 学习新事物</button></div></div>
<div class="canvas-bottom"><div><span class="hint-dot"></span>拖动泡泡靠近彼此，试着连接灵感</div><div class="tools"><button id="add-source">＋ 添加资料</button><button id="undo" disabled>↶ 撤销</button><button id="inspect">Jev 判断记录</button></div></div>
</main>
<aside id="drawer" hidden aria-label="泡泡详情"><div class="drawer-head"><span id="drawer-kicker" class="eyebrow">IDEA DETAILS</span><button id="close" aria-label="关闭详情">×</button></div><div id="drawer-content"></div></aside>
<dialog id="fusion"><form method="dialog"><button class="dialog-close" value="cancel" aria-label="取消融合">×</button></form><span class="eyebrow">A NEW CONNECTION</span><h2>这两个念头，可以怎样连接？</h2><div id="fusion-content"></div><button id="cancel-fusion" class="secondary">保持两个泡泡</button></dialog>
<div id="toast" role="status" hidden></div>
<script type="module" src="/js/bubbles/app.mjs"></script></body></html>
